replicaCount: 1
fullnameOverride: grafana

image:
  repository: grafana/grafana
  tag: "12.2.0"

service:
  type: ClusterIP
  port: 3000

admin:
  username: admin
  password: admin

anonymousViewer: false

datasources:
  mimirUrl: http://mimir:9009/prometheus
  tempoUrl: http://tempo:3200
  lokiUrl: http://loki:3100

resources:
  requests:
    cpu: 100m
    memory: 128Mi
