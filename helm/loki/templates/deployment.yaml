apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods automatically when the configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: loki
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      args: ["-config.file=/etc/loki/loki-config.yaml"]
      ports:
        - {name: http, containerPort: 3100}
        - {name: grpc, containerPort: 9096}
      readinessProbe:
        httpGet: {path: /ready, port: http}
      resources:
        {{- toYaml .Values.resources | nindent 4 }}
      volumeMounts:
        - {name: config, mountPath: /etc/loki}
        - {name: data, mountPath: /tmp/loki}
  volumes:
    - name: config
      configMap:
        name: {{ include "chart.fullname" . }}
    - name: data
      emptyDir: {}
