apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    # OpenTelemetry Collector: the single hub for all telemetry (vendor-neutral pipeline).
    # services (OTLP) + infra scrapes (Kong/Keycloak/Kafka/Postgres exporters) --> Collector --> Mimir (metrics, OTLP) / Tempo (traces, OTLP) / Loki (logs, OTLP)
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Kong exposes Prometheus metrics; the Collector scrapes them so Mimir only needs the Collector.
      prometheus/kong:
        config:
          scrape_configs:
            - job_name: kong
              scrape_interval: 15s
              static_configs:
                - targets: ["${env:KONG_STATUS_ENDPOINT}"]
      # Keycloak (Quarkus Micrometer) exposes OpenMetrics at :9000/metrics when --metrics-enabled=true.
      prometheus/keycloak:
        config:
          scrape_configs:
            - job_name: keycloak
              scrape_interval: 15s
              metrics_path: /metrics
              static_configs:
                - targets: ["${env:KEYCLOAK_METRICS_ENDPOINT}"]
      # Kafka broker/topic/consumer-group metrics via kafka-exporter.
      prometheus/kafka:
        config:
          scrape_configs:
            - job_name: kafka
              scrape_interval: 15s
              static_configs:
                - targets: ["${env:KAFKA_EXPORTER_ENDPOINT}"]
      # One postgres-exporter per database-per-service store.
      prometheus/postgres:
        config:
          scrape_configs:
            - job_name: postgres-customer-core
              scrape_interval: 15s
              static_configs:
                - targets: ["${env:POSTGRES_CORE_EXPORTER_ENDPOINT}"]
                  labels:
                    db_instance: customer-core-db
            - job_name: postgres-reference-data
              scrape_interval: 15s
              static_configs:
                - targets: ["${env:POSTGRES_REF_EXPORTER_ENDPOINT}"]
                  labels:
                    db_instance: reference-data-db

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
      resource:
        attributes:
          - key: deployment.environment.name
            value: ${env:DEPLOYMENT_ENVIRONMENT}
            action: upsert

    exporters:
      # Grafana Mimir accepts native OTLP over HTTP at <mimir-host>/otlp.
      otlphttp/mimir:
        endpoint: ${env:MIMIR_OTLP_ENDPOINT}
        tls:
          insecure: true
      # Grafana Tempo accepts OTLP over gRPC (default :4317).
      otlp/tempo:
        endpoint: ${env:TEMPO_OTLP_ENDPOINT}
        tls:
          insecure: true
      # Grafana Loki accepts native OTLP over HTTP at <loki-host>/otlp.
      otlphttp/loki:
        endpoint: ${env:LOKI_OTLP_ENDPOINT}
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp, prometheus/kong, prometheus/keycloak, prometheus/kafka, prometheus/postgres]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/mimir]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
