apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    # OpenTelemetry Collector: the single hub for all telemetry (vendor-neutral pipeline).
    # services (OTLP) --> Collector --> Prometheus (metrics, pull) / Jaeger (traces, OTLP) / debug (logs)
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Kong exposes Prometheus metrics; the Collector scrapes them so Prometheus only needs one target.
      prometheus/kong:
        config:
          scrape_configs:
            - job_name: kong
              scrape_interval: 15s
              static_configs:
                - targets: ["${env:KONG_STATUS_ENDPOINT}"]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
      resource:
        attributes:
          - key: deployment.environment.name
            value: ${env:DEPLOYMENT_ENVIRONMENT}
            action: upsert

    exporters:
      otlp/jaeger:
        endpoint: ${env:JAEGER_OTLP_ENDPOINT}
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      # No log backend is part of this sample; logs are printed by the Collector.
      # Add e.g. a Loki/OpenSearch exporter here without touching the services.
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp, prometheus/kong]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [debug]
