replicaCount: 1
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.135.0"

service:
  type: ClusterIP
  otlpGrpcPort: 4317
  otlpHttpPort: 4318

deploymentEnvironment: production
mimirOtlpEndpoint: http://mimir:9009/otlp
tempoOtlpEndpoint: tempo:4317
lokiOtlpEndpoint: http://loki:3100/otlp
kongStatusEndpoint: kong:8100
# Infra scrape targets (DNS names inside the cluster). Mirrors docker-compose wiring.
keycloakMetricsEndpoint: keycloak:9000
kafkaExporterEndpoint: kafka:9308
postgresCoreExporterEndpoint: customer-core-service-db:9187
postgresRefExporterEndpoint: reference-data-service-db:9187

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
