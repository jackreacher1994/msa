replicaCount: 1
fullnameOverride: jaeger

image:
  repository: jaegertracing/jaeger
  tag: "2.10.0"

service:
  type: ClusterIP
  uiPort: 16686
  otlpGrpcPort: 4317
  otlpHttpPort: 4318

# In-memory storage is for demos only; switch the jaeger_storage backend (e.g. Elasticsearch/Cassandra) in production.
maxTraces: 100000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
