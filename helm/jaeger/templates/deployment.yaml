apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods automatically when the configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: jaeger
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      args: ["--config=/etc/jaeger/config.yaml"]
      ports:
        - {name: ui, containerPort: 16686}
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: health, containerPort: 13133}
      readinessProbe:
        httpGet: {path: /status, port: health}
      resources:
        {{- toYaml .Values.resources | nindent 4 }}
      volumeMounts:
        - {name: config, mountPath: /etc/jaeger}
  volumes:
    - name: config
      configMap:
        name: {{ include "chart.fullname" . }}
