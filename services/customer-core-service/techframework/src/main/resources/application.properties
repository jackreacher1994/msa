# Quarkus 3.15 LTS config (12-factor: every env-specific value overridable via env vars).
quarkus.application.name=customer-core-service
quarkus.http.port=${SERVER_PORT:8081}

# Datasource (database per service).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_core}
quarkus.datasource.username=${DB_USERNAME:customer_core}
quarkus.datasource.password=${DB_PASSWORD:customer_core}

# Schema owned by Flyway; Hibernate only validates.
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT verification against Keycloak JWKS (Kong at edge; service re-validates).
mp.jwt.verify.publickey.location=${JWT_JWK_SET_URI:http://localhost:8080/realms/customer/protocol/openid-connect/certs}
mp.jwt.verify.issuer=http://localhost:8080/realms/customer
smallrye.jwt.enabled=true

# HTTP auth: health public, API requires authenticated JWT.
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Reference Data outbound client (MicroProfile REST client, Timeout pattern).
quarkus.rest-client.reference-data.url=${REFERENCE_DATA_BASE_URL:http://localhost:8082}
quarkus.rest-client.reference-data.connect-timeout=${REFERENCE_DATA_CONNECT_TIMEOUT:2000}
quarkus.rest-client.reference-data.read-timeout=${REFERENCE_DATA_READ_TIMEOUT:3000}

# OpenTelemetry extension (replaces javaagent).
quarkus.otel.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:customer-core-service}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) [traceId=%X{traceId}, spanId=%X{spanId}, correlationId=%X{correlationId}] %s%e%n

quarkus.native.resources.includes=db/migration/*.sql
