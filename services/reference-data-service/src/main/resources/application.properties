# Quarkus 3.15 LTS config (12-factor: every env-specific value overridable via env vars).
quarkus.application.name=reference-data-service
quarkus.http.port=${SERVER_PORT:8082}

# Datasource (database per service). DB_URL is a full JDBC URL like jdbc:postgresql://host:5432/reference_data
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/reference_data}
quarkus.datasource.username=${DB_USERNAME:reference_data}
quarkus.datasource.password=${DB_PASSWORD:reference_data}

# Schema is owned by Flyway; Hibernate only validates.
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT verification against Keycloak JWKS (Kong validates at edge; service re-validates defense-in-depth).
# SmallRye JWT: remote JWKS location.
mp.jwt.verify.publickey.location=${JWT_JWK_SET_URI:http://localhost:8080/realms/customer/protocol/openid-connect/certs}
mp.jwt.verify.issuer=http://localhost:8080/realms/customer
smallrye.jwt.enabled=true

# HTTP auth: health endpoints public, API requires authenticated JWT.
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# OpenTelemetry extension (replaces javaagent). Exporter endpoint from standard OTEL env.
quarkus.otel.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:reference-data-service}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}

# Log correlation: Quarkus includes traceId/spanId via MDC when OTel is enabled.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) [traceId=%X{traceId}, spanId=%X{spanId}] %s%e%n

# Native: include Flyway migrations in the native image.
quarkus.native.resources.includes=db/migration/*.sql
