server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: reference-data-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reference_data}
    username: ${DB_USERNAME:reference_data}
    password: ${DB_PASSWORD:reference_data}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/customer/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
