# OpenTelemetry Collector: the single hub for all telemetry (vendor-neutral pipeline).
# services (OTLP) --> Collector --> Mimir (metrics, OTLP) / Tempo (traces, OTLP) / Loki (logs, OTLP)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Kong exposes Prometheus metrics; the Collector scrapes them so Mimir only needs the Collector.
  prometheus/kong:
    config:
      scrape_configs:
        - job_name: kong
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:KONG_STATUS_ENDPOINT}"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

exporters:
  # Grafana Mimir accepts native OTLP over HTTP at <mimir-host>/otlp.
  otlphttp/mimir:
    endpoint: ${env:MIMIR_OTLP_ENDPOINT}
    tls:
      insecure: true
  # Grafana Tempo accepts OTLP over gRPC (default :4317).
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true
  # Grafana Loki accepts native OTLP over HTTP at <loki-host>/otlp.
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, prometheus/kong]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
