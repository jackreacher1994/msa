global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # All application and gateway metrics are exposed by the OpenTelemetry Collector's Prometheus exporter.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
