# Local development stack: 2 microservices + Kong + Keycloak + OpenTelemetry Collector + Grafana LGTM (Mimir/Tempo/Loki).
# Only the edge (Kong), the IdP and the observability UIs are published to the host; services are reached via Kong.
name: customer-msa

x-otel-env: &otel-env
  # Standard OpenTelemetry SDK environment variables read by the Java agent (no vendor SDKs).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=customer-msa,deployment.environment.name=local

services:
  # ---------- Database per service: each microservice owns its data store ----------
  customer-core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer_core
      POSTGRES_USER: customer_core
      POSTGRES_PASSWORD: customer_core
    volumes: [customer-core-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_core -d customer_core"]
      interval: 5s
      retries: 20

  reference-data-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reference_data
      POSTGRES_USER: reference_data
      POSTGRES_PASSWORD: reference_data
    volumes: [reference-data-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference_data -d reference_data"]
      interval: 5s
      retries: 20

  # ---------- Microservices ----------
  customer-core-service:
    build:
      context: ./services/customer-core-service
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: customer-msa/customer-core-service:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: customer-core-service
      DB_URL: jdbc:postgresql://customer-core-db:5432/customer_core
      DB_USERNAME: customer_core
      DB_PASSWORD: customer_core
      JWT_JWK_SET_URI: http://keycloak:8080/realms/customer/protocol/openid-connect/certs
      REFERENCE_DATA_BASE_URL: http://reference-data-service:8082
    depends_on:
      customer-core-db: {condition: service_healthy}
      reference-data-service: {condition: service_started}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      retries: 30

  reference-data-service:
    build:
      context: ./services/reference-data-service
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: customer-msa/reference-data-service:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: reference-data-service
      DB_URL: jdbc:postgresql://reference-data-db:5432/reference_data
      DB_USERNAME: reference_data
      DB_PASSWORD: reference_data
      JWT_JWK_SET_URI: http://keycloak:8080/realms/customer/protocol/openid-connect/certs
    depends_on:
      reference-data-db: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      retries: 30

  # ---------- Edge: API Gateway + Identity Provider ----------
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./infra/kong/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000", "8001:8001"]
    depends_on: [customer-core-service, reference-data-service, otel-collector]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed public URL => stable `iss` claim (http://localhost:8080/realms/customer) that Kong trusts,
      # while containers may still reach Keycloak internally at http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./infra/keycloak/customer-realm.json:/opt/keycloak/data/import/customer-realm.json:ro"]
    ports: ["8080:8080"]

  # ---------- Observability (OpenTelemetry-first, Grafana LGTM) ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      MIMIR_OTLP_ENDPOINT: http://mimir:9009/otlp
      TEMPO_OTLP_ENDPOINT: tempo:4317
      LOKI_OTLP_ENDPOINT: http://loki:3100/otlp
      KONG_STATUS_ENDPOINT: kong:8100
      DEPLOYMENT_ENVIRONMENT: local
    volumes: ["./infra/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [mimir, tempo, loki]

  mimir:
    image: grafana/mimir:3.2.1
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes: ["./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro", "mimir-data:/tmp/mimir"]
    ports: ["9009:9009"]

  tempo:
    image: grafana/tempo:2.9.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro", "tempo-data:/tmp/tempo"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes: ["./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro", "loki-data:/tmp/loki"]
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [mimir, tempo, loki]

volumes:
  customer-core-db:
  reference-data-db:
  mimir-data:
  tempo-data:
  loki-data:
